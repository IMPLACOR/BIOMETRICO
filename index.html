<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Administrador de Nombres</title>
<style>
body { font-family: Arial; text-align:center; margin-top:40px; }
input { padding:8px; width:200px; }
button { padding:8px 15px; margin:5px; cursor:pointer; }
ul { list-style:none; padding:0; }
li { margin:6px; }
</style>
</head>
<body>

<h2>Administrar Nombres</h2>

<input type="text" id="nuevoNombre" placeholder="Escribir nombre">
<br><br>
<button id="btnAgregar">Agregar</button>
<button id="btnGuardar">Guardar Cambios</button>

<h3>Lista actual</h3>
<ul id="listaNombres"></ul>

<script>

// ===== CONFIG =====
const usuario = "202000790-alt";
const repo = "biometrico2";
const archivo = "nombres.txt";
const rama = "main";
const token = "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"; // ← PON TU TOKEN NUEVO

let nombres = [];

// ===== CARGAR NOMBRES =====
async function cargarNombres() {
  try {

    const response = await fetch(
      `https://api.github.com/repos/${usuario}/${repo}/contents/${archivo}?ref=${rama}`,
      {
        headers: {
          "Authorization": "token " + token
        }
      }
    );

    if (!response.ok) {
      console.log("Error lectura:", response.status);
      return;
    }

    const data = await response.json();

    const contenido = atob(data.content.replace(/\n/g, ""));

    nombres = contenido.split("\n").filter(n => n.trim() !== "");

    mostrarLista();

  } catch (error) {
    console.log("Error cargar:", error);
  }
}

// ===== MOSTRAR LISTA =====
function mostrarLista() {
  const ul = document.getElementById("listaNombres");
  ul.innerHTML = "";

  nombres.forEach((nombre, index) => {

    const li = document.createElement("li");
    li.textContent = nombre + " ";

    const btn = document.createElement("button");
    btn.textContent = "X";
    btn.onclick = function() {
      eliminarNombre(index);
    };

    li.appendChild(btn);
    ul.appendChild(li);
  });
}

// ===== AGREGAR =====
function agregarNombre() {
  const input = document.getElementById("nuevoNombre");
  const nuevo = input.value.trim();

  if (nuevo !== "") {
    nombres.push(nuevo);
    input.value = "";
    mostrarLista();
  }
}

// ===== ELIMINAR =====
function eliminarNombre(index) {
  nombres.splice(index, 1);
  mostrarLista();
}

// ===== GUARDAR =====
async function guardarCambios() {
  try {

    const response = await fetch(
      `https://api.github.com/repos/${usuario}/${repo}/contents/${archivo}?ref=${rama}`,
      {
        headers: {
          "Authorization": "token " + token
        }
      }
    );

    const data = await response.json();

    const contenidoNuevo = btoa(nombres.join("\n"));

    const putResponse = await fetch(
      `https://api.github.com/repos/${usuario}/${repo}/contents/${archivo}`,
      {
        method: "PUT",
        headers: {
          "Authorization": "token " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Actualizando nombres desde web",
          content: contenidoNuevo,
          sha: data.sha,
          branch: rama
        })
      }
    );

    if (putResponse.ok) {
      alert("Nombres actualizados correctamente");
      cargarNombres();
    } else {
      const error = await putResponse.text();
      console.log(error);
      alert("Error al guardar");
    }

  } catch (error) {
    console.log("Error guardar:", error);
  }
}

// ===== EVENTOS BOTONES =====
document.getElementById("btnAgregar").addEventListener("click", agregarNombre);
document.getElementById("btnGuardar").addEventListener("click", guardarCambios);

// Cargar al iniciar
cargarNombres();

</script>

</body>
</html>
