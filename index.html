<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Administrador de Nombres</title>
  <style>
    body { font-family: Arial; text-align:center; margin-top:40px; }
    input { padding:8px; width:200px; }
    button { padding:8px 15px; margin:5px; }
    ul { list-style:none; padding:0; }
  </style>
</head>
<body>

<h2>Administrar Nombres</h2>

<input type="text" id="nuevoNombre" placeholder="Escribir nombre">
<br>
<button onclick="agregarNombre()">Agregar</button>
<button onclick="guardarCambios()">Guardar Cambios</button>

<h3>Lista actual</h3>
<ul id="listaNombres"></ul>

<script>

const usuario = "202000790-alt";
const repo = "biometrico2";
const archivo = "nombres.txt";
const token = "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"; // ⚠ SOLO PARA USO PRIVADO

let nombres = [];

async function cargarNombres() {
  const respuesta = await fetch(
    `https://api.github.com/repos/${usuario}/${repo}/contents/${archivo}`
  );
  const data = await respuesta.json();
  const contenido = atob(data.content);
  nombres = contenido.split("\n").filter(n => n.trim() !== "");
  mostrarLista();
}

function mostrarLista() {
  const ul = document.getElementById("listaNombres");
  ul.innerHTML = "";
  nombres.forEach((nombre, index) => {
    const li = document.createElement("li");
    li.innerHTML = `${nombre} 
    <button onclick="eliminarNombre(${index})">X</button>`;
    ul.appendChild(li);
  });
}

function agregarNombre() {
  const nuevo = document.getElementById("nuevoNombre").value.trim();
  if (nuevo !== "") {
    nombres.push(nuevo);
    document.getElementById("nuevoNombre").value = "";
    mostrarLista();
  }
}

function eliminarNombre(index) {
  nombres.splice(index, 1);
  mostrarLista();
}

async function guardarCambios() {

  const respuesta = await fetch(
    `https://api.github.com/repos/${usuario}/${repo}/contents/${archivo}`
  );
  const data = await respuesta.json();

  const nuevoContenido = btoa(nombres.join("\n"));

  await fetch(
    `https://api.github.com/repos/${usuario}/${repo}/contents/${archivo}`,
    {
      method: "PUT",
      headers: {
        "Authorization": "token " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "Actualizando nombres",
        content: nuevoContenido,
        sha: data.sha
      })
    }
  );

  alert("Nombres actualizados correctamente");
}

cargarNombres();

</script>

</body>
</html>
