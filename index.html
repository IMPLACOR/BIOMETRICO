<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IMPLACOR - Sistema Biométrico</title>

<style>
body { font-family: Arial; text-align:center; }
button { padding:10px 20px; margin:10px; font-size:15px; }
select { padding:5px; }
table { border-collapse: collapse; margin:auto; margin-top:20px;}
th, td { border:1px solid black; padding:6px; }
</style>

</head>
<body>

<h2>IMPLACOR - Registros Biométricos</h2>

<button onclick="cargarCSV()">Cargar CSV desde GitHub</button>

<br><br>

<select id="trabajadores"></select>
<button onclick="ordenar()">Ordenar</button>
<button onclick="descargar()">Descargar CSV Ordenado</button>

<table id="tabla">
<thead>
<tr>
<th>Fecha</th>
<th>Ingreso</th>
<th>Almuerzo</th>
<th>Retorno</th>
<th>Salida</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

let datos = [];
let datosOrdenados = [];

async function cargarCSV() {

    try {

        const response = await fetch("registros.csv?nocache=" + new Date().getTime());
        const text = await response.text();

        datos = text.trim().split("\n").map(line => line.split(","));

        // Asumimos formato:
        // Fecha,Hora,Nombre

        let nombres = [...new Set(datos.slice(1).map(row => row[2]))];

        let select = document.getElementById("trabajadores");
        select.innerHTML = "";

        nombres.forEach(nombre => {
            let option = document.createElement("option");
            option.value = nombre;
            option.text = nombre;
            select.appendChild(option);
        });

        alert("CSV cargado correctamente desde GitHub");

    } catch (error) {
        alert("Error cargando CSV");
        console.error(error);
    }
}

function ordenar() {

    let nombre = document.getElementById("trabajadores").value;

    let registros = datos
        .slice(1)
        .filter(row => row[2] === nombre);

    let agrupado = {};

    registros.forEach(row => {

        let fecha = row[0];
        let hora = row[1];

        if (!agrupado[fecha]) {
            agrupado[fecha] = [];
        }

        agrupado[fecha].push(hora);
    });

    datosOrdenados = [];
    let tbody = document.querySelector("#tabla tbody");
    tbody.innerHTML = "";

    Object.keys(agrupado).sort().forEach(fecha => {

        let horas = agrupado[fecha].sort();

        let ingreso  = horas[0] || "";
        let almuerzo = horas[1] || "";
        let retorno  = horas[2] || "";
        let salida   = horas[3] || "";

        datosOrdenados.push(`${fecha},${ingreso},${almuerzo},${retorno},${salida}`);

        let fila = `
        <tr>
        <td>${fecha}</td>
        <td>${ingreso}</td>
        <td>${almuerzo}</td>
        <td>${retorno}</td>
        <td>${salida}</td>
        </tr>`;

        tbody.innerHTML += fila;
    });
}

function descargar() {

    let encabezado = "Fecha,Ingreso,Almuerzo,Retorno,Salida\n";
    let contenido = encabezado + datosOrdenados.join("\n");

    let blob = new Blob([contenido], { type: "text/csv" });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "ordenado.csv";
    link.click();
}

</script>

</body>
</html>
