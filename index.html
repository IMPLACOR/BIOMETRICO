<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPLACOR - Sistema Biométrico</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="main-header">
    <div class="top-bar"></div>

    <div class="header-content">
        <img src="logo.png" alt="Logo IMPLACOR">
        <h1>
            IMPLACOR
            <span>Sistema de Control Biométrico</span>
        </h1>
    </div>
</header>

<div class="container">

    <div class="controls">
    
        <button onclick="cargarCSV()">Cargar Registros</button>
        <button onclick="cargarLOG()">Cargar Logs</button>
    
        <select id="trabajadores"></select>
    
        <!-- 🔥 FILTRO POR MES -->
        <select id="mes">
            <option value="">Todos los meses</option>
            <option value="01">Enero</option>
            <option value="02">Febrero</option>
            <option value="03">Marzo</option>
            <option value="04">Abril</option>
            <option value="05">Mayo</option>
            <option value="06">Junio</option>
            <option value="07">Julio</option>
            <option value="08">Agosto</option>
            <option value="09">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
        </select>
    
        <!-- 🔥 FILTRO POR ID -->
        <input type="text" id="idFiltro" placeholder="Filtrar por ID">
    
        <button onclick="procesar()">Procesar</button>
        <button onclick="descargar()">Descargar</button>
    
    </div>

    <table id="tabla">
        <thead>
        <tr>
            <th>Fecha</th>
            <th>IngresoA</th>
            <th>SalidaA</th>
            <th>IngresoB</th>
           <th>SalidaB</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<footer>
    © 2026 IMPLACOR - Sistema de Control Biométrico
</footer>

<script src="script.js?v=2"></script>

</body>
</html>
