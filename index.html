<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPLACOR - Sistema Biométrico</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>
    <img src="img/logo.png" alt="Logo IMPLACOR">
    <h1>IMPLACOR - Sistema Biométrico</h1>
</header>

<div class="container">

    <div class="controls">
        <button onclick="cargarCSV()">Cargar CSV</button>

        <select id="trabajadores"></select>

        <button onclick="ordenar()">Ordenar</button>
        <button onclick="descargar()">Descargar CSV</button>
    </div>

    <table id="tabla">
        <thead>
        <tr>
            <th>Fecha</th>
            <th>Ingreso</th>
            <th>Almuerzo</th>
            <th>Retorno</th>
            <th>Salida</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<footer>
    © 2026 IMPLACOR - Sistema de Control Biométrico
</footer>

<script src="script.js"></script>

</body>
</html>
